name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/sci-select/requirements.txt
      - run: pip install -r skills/sci-select/requirements.txt python-docx lxml pytest
      - run: python -m unittest discover -s tests -p "test_*.py"
        working-directory: skills/sci-select
      - run: python -m scripts.audit_journal_index assets/sci_select_journals.sqlite --sample-size 20 --max-severe-mismatch-rate 0.02
        working-directory: skills/sci-select
      - run: python -m py_compile scripts/*.py
        working-directory: skills/sci-select
      - run: python -m unittest discover -s tests -p "test_*.py"
        working-directory: skills/ai-cross
      - run: python -m pytest scripts/test_cugb_format_tools.py -q
        working-directory: skills/cugb-doctoral-thesis-format
