name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run abstract-fig tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest skills/abstract-fig/tests -q
